[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-hk-model"
version = "0.1.0"
description = "Reusable analysis and modeling code for the extended HK model"
requires-python = ">=3.10"
dependencies = [
  "igraph",
  "leidenalg",
  "lz4",
  "matplotlib",
  "msgpack",
  "networkx",
  "numpy",
  "python-dotenv",
  "scipy",
  "seaborn",
  "sqlalchemy",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
